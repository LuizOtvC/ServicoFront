<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Minhas Propostas Enviadas</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
        <style>
            .page-content{
                max-width:520px;
                margin:0 auto;
                padding:2rem 1rem;
                position:relative;
                z-index:1;
            }

            body{
                min-height:100vh;
            }

            .empty-state{
                color:rgba(255,255,255,.75);
            }

            .page-title{
                color:#fff;
                font-weight:700;
                font-size:25px;
                margin-bottom:1.5rem;
                text-align:center;
            }

            .btn-voltar {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: transparent;
                border: 1px solid rgba(255, 255, 255, 0.5);
                color: #fff;
                border-radius: 8px;
                padding: 8px 15px;
                font-size: 13px;
                text-decoration: none;
                cursor: pointer;
                transition: background 0.2s, color 0.2s;
            }
            .btn-voltar:hover {
                background: #fff;
                color: #1a1a2e;
            }

            .header-top{
                margin-bottom:1.5rem;
            }

            .proposta-card{
                background:rgba(255,255,255,.10);
                border:1px solid rgba(255,255,255,.15);
                backdrop-filter:blur(12px);
                border-radius:12px;
                padding:14px;
                margin-bottom:14px;
                color:white;
                transition:.2s;
            }

            .proposta-card:hover{
                background:rgba(255,255,255,.13);
                border-color:rgba(255,255,255,.25);
            }

            .proposta-header{
                display:flex;
                justify-content:space-between;
                align-items:flex-start;
                gap:8px;
                margin-bottom:8px;
            }

            .proposta-projeto{
                font-size:14px;
                font-weight:600;
                color:white;
                margin:0;
            }

            .proposta-projeto a{
                color:white;
                text-decoration:none;
            }

            .proposta-projeto a:hover{
                color:#93c5fd;
            }

            .proposta-status{
                display:inline-block;
                font-size:10px;
                font-weight:600;
                border-radius:20px;
                padding:2px 10px;
                white-space:nowrap;
            }

            .status-pendente{
                background:#fff3cd;
                color:#856404;
            }

            .status-aceita{
                background:#d4edda;
                color:#155724;
            }

            .status-recusada{
                background:#f8d7da;
                color:#721c24;
            }

            .status-cancelada{
                background:#e2e3e5;
                color:#383d41;
            }

            .status-default{
                background:#e2e3e5;
                color:#383d41;
            }

            .proposta-descricao{
                font-size:13px;
                color:#dbeafe;
                margin:8px 0;
            }

            .proposta-footer{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-top:10px;
                padding-top:10px;
                border-top:1px solid rgba(255,255,255,.15);
            }

            .proposta-valor{
                font-size:15px;
                font-weight:700;
                color:white;
            }

            .proposta-data{
                font-size:11px;
                color:#cbd5e1;
            }

            .btn-cancelar{
                width:100%;
                margin-top:12px;
                border:none;
                border-radius:8px;
                padding:8px;
                font-size:13px;
                font-weight:600;
                background:#dc3545;
                color:white;
                transition:.2s;
            }

            .btn-cancelar:hover{
                background:#bb2d3b;
            }
        </style>
    <div th:replace="~{fragment/Background :: background-css}"></div>
</head>
<body class="background-padrao">
    <div th:replace="~{fragment/navbar :: custom-header}"></div>
    <div class="page-content">

        <div class="header-top">
            <a th:href="@{/}" class="btn-voltar">
                <i class="ti ti-arrow-left"></i> Voltar
            </a>
        </div>

        <h2 class="page-title">Minhas propostas enviadas</h2>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <div th:if="${#lists.isEmpty(propostas)}" class="text-center empty-state" style="margin-top: 3rem;">
            <i class="ti ti-mood-empty" style="font-size: 40px;"></i>
            <p style="margin-top: 8px;">Você ainda não enviou nenhuma proposta.</p>
        </div>

        <div th:each="p : ${propostas}" class="proposta-card">
            <div class="proposta-header">
                <p class="proposta-projeto">
                    Serviço:
                    <a th:href="@{/projetoporId/{id}(id=${p.projetoId})}" th:text="${p.nomeProjeto}">
                        Título do serviço
                    </a>
                </p>
                <span class="proposta-status"
                      th:text="${p.status}"
                      th:classappend="${
                      #strings.equalsIgnoreCase(p.status, 'PENDENTE')} ? 'status-pendente' :
                      (${#strings.equalsIgnoreCase(p.status, 'ACEITA')} ? 'status-aceita' :
                      (${#strings.equalsIgnoreCase(p.status, 'RECUSADA')} ? 'status-recusada' :
                      (${#strings.equalsIgnoreCase(p.status, 'CANCELADA')} ? 'status-cancelada' : 'status-default')))">
                    PENDENTE
                </span>
            </div>

            <p class="proposta-descricao" th:text="${p.descricao}">Descrição do serviço</p>

            <div class="proposta-footer">
    <span class="proposta-valor">
        <span th:if="${p.valorProposto == 0}">
            A ser definido pelo profissional
        </span>

        <span th:unless="${p.valorProposto == 0}">
            R$ <span th:text="${p.valorProposto}">0,00</span>
        </span>
    </span>

    <span class="proposta-data"
          th:text="${#temporals.format(p.enviadoEm, 'dd/MM/yyyy HH:mm')}">
        —
    </span>
</div>

            <form th:if="${#strings.equalsIgnoreCase(p.status, 'PENDENTE')}"
                  th:action="@{/cancelar/{id}(id=${p.id})}" method="post">
                <button type="submit" class="btn-cancelar">Cancelar proposta</button>
            </form>
        </div>

    </div>
</body>
</html>
