<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Atualizar Perfil - ServiçoFinal</title>

        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>

    <div th:replace="~{fragment/Background :: background-css}"></div>

    <style>
        .page-content{
            width:100%;
            max-width:520px;
            margin:50px auto 60px;
            padding:0 20px;
        }

        .card{
            background: rgba(13, 27, 62, .72);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255,255,255,.12);
            border-radius:20px;
            box-shadow:0 20px 60px rgba(3,8,20,.40);
            overflow:hidden;
        }

        .card-header{
            background:transparent;
            border-bottom:1px solid rgba(255,255,255,.16);
            text-align:center;
            padding:2rem 2rem 1.5rem;
        }

        .card-header h4{
            color:white;
            font-weight:700;
            margin-bottom:6px;
        }

        .card-header p{
            color:#cbd5e1;
            margin:0;
            font-size:14px;
        }

        .card-body{
            padding:2rem;
        }

        .form-label{
            color:white;
            font-weight:600;
            margin-bottom:8px;
        }

        .form-control,
        .form-select{
            border-radius:10px;
            min-height:45px;
            background:rgba(255,255,255,.94);
            border:1px solid rgba(255,255,255,.25);
            color:#1a1a2e;
        }

        .form-control:focus,
        .form-select:focus{
            background:white;
            border-color:#60a5fa;
            box-shadow:0 0 0 .2rem rgba(96,165,250,.25);
        }

        textarea.form-control{
            min-height:120px;
        }

        small{
            color:#cbd5e1 !important;
        }

        .btn-principal{
            width:100%;
            background:white;
            color:#0d1b3e;
            border:none;
            border-radius:10px;
            padding:12px;
            font-weight:600;
            transition:.2s;
        }

        .btn-principal:hover{
            background:#dbeafe;
            color:#0d1b3e;
        }

        .btn-secundario{
            display:block;
            width:100%;
            margin-top:12px;
            text-align:center;
            text-decoration:none;
            border:1px solid rgba(255,255,255,.5);
            color:white;
            border-radius:10px;
            padding:12px;
            transition:.2s;
        }

        .btn-secundario:hover{
            background:rgba(255,255,255,.1);
            border-color:white;
            color:white;
        }
    </style>
</head>

<body class="background-padrao">

    <div th:replace="~{fragment/navbar :: custom-header}"></div>

    <div class="page-content">

        <div class="card">

            <div class="card-header">
                <h4>Atualizar Perfil</h4>
                <p>Atualize seus dados</p>
            </div>

            <div class="card-body">

                <div th:if="${errorMessage}"
                     class="alert alert-danger"
                     role="alert">
                    <span th:text="${errorMessage}"></span>
                </div>

                <form action="/atualizar" method="post" th:object="${atualizar}">

                    <div class="mb-3">
                        <label class="form-label">Nome completo</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nome}"
                               placeholder="João Silva"
                               required
                               autofocus/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Telefone</label>

                        <input type="tel"
                               class="form-control"
                               th:field="*{telefone}"
                               placeholder="(11) 99999-9999"/>

                        <small>
                            Informe um telefone válido no formato (11) 99999-9999.
                            O telefone deve conter DDD e número com 11 dígitos.
                        </small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>

                        <textarea class="form-control"
                                  rows="3"
                                  th:field="*{descricao}"
                                  placeholder="Fale um pouco sobre você..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Dias de trabalho</label>

                        <select th:field="*{diasTrabalho}"
                                multiple
                                class="form-select"
                                size="7">

                            <option value="SEGUNDA">Segunda</option>
                            <option value="TERCA">Terça</option>
                            <option value="QUARTA">Quarta</option>
                            <option value="QUINTA">Quinta</option>
                            <option value="SEXTA">Sexta</option>
                            <option value="SABADO">Sábado</option>
                            <option value="DOMINGO">Domingo</option>

                        </select>

                        <small>
                            Segure Ctrl (ou Cmd no Mac) para selecionar mais de um dia.
                        </small>
                    </div>

                    <button type="submit" class="btn-principal">
                        Atualizar
                    </button>

                </form>

                <a th:href="@{/perfil}" class="btn-secundario">
                    Cancelar atualização de perfil
                </a>

            </div>

        </div>

    </div>

</body>
</html>
