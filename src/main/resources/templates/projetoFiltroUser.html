<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Meus Serviços</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
    <style>
        .page-content {
            max-width: 520px;
            margin: 0 auto;
            padding: 2rem 1rem;
            position: relative;
            z-index: 1;
        }
        .page-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 25px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .projeto-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(3, 8, 20, 0.28);
            margin-bottom: 1rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .projeto-card:hover {
            background: rgba(255, 255, 255, 0.11);
            border-color: rgba(255, 255, 255, 0.24);
            box-shadow: 0 10px 28px rgba(3, 8, 20, 0.34);
        }
        .projeto-titulo { font-size: 15px; font-weight: 600; color: #ffffff; margin: 0 0 4px; }
        .projeto-status {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            border-radius: 20px;
            padding: 2px 10px;
            margin-bottom: 8px;
        }
        .status-aberto       { background: #d4edda; color: #155724; }
        .status-em_andamento { background: #fff3cd; color: #856404; }
        .status-concluido    { background: #d1ecf1; color: #0c5460; }
        .status-cancelado    { background: #f8d7da; color: #721c24; }
        .projeto-servicos { font-size: 12px; color: rgba(255,255,255,0.7); margin: 0; }
        .projeto-servicos span {
            display: inline-block;
            background: #f0f4ff;
            border: 1px solid #d0d9f5;
            border-radius: 20px;
            padding: 2px 8px;
            margin: 2px;
            font-size: 11px;
            color: #2E5395;
        }
       .btn-voltar {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: transparent;
                border: 1px solid rgba(255, 255, 255, 0.5);
                color: #fff;
                border-radius: 8px;
                padding: 8px 15px;
                font-size: 13px;
                text-decoration: none;
                cursor: pointer;
                transition: background 0.2s, color 0.2s;
            }
            .btn-voltar:hover {
                background: #fff;
                color: #1a1a2e;
            }
        .projeto-detalhes {
            display: none;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            padding-top: 10px;
        }
        .projeto-detalhes.aberto { display: block; }
        .detalhe-row { font-size: 12px; color: rgba(255,255,255,0.75); margin-bottom: 4px; }
        .detalhe-row strong { color: #ffffff; }
        .btn-ver-mais {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            color: #9ec5ff;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-ver-mais:hover { text-decoration: underline; }
        .empty-state { color: rgba(255,255,255,0.75); }
        a.btn-voltar {
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;

    background: transparent !important;
    border: 1px solid rgba(255,255,255,.5) !important;
    color: white !important;

    border-radius: 8px !important;
    padding: 8px 15px !important;

    font-size: 13px !important;
    text-decoration: none !important;
    cursor: pointer !important;
}

a.btn-voltar:hover {
    background: white !important;
    color: #1a1a2e !important;
}
.projeto-detalhes .btn-outline-dark {
    color: #fff !important;
    border-color: rgba(255, 255, 255, 0.4) !important;
    background: transparent !important;
}

.projeto-detalhes .btn-outline-dark:hover {
    color: #1a1a2e !important;
    background: #fff !important;
    border-color: #fff !important;
}
    </style>
    <div th:replace="~{fragment/Background :: background-css}"></div>
</head>
<body class="background-padrao">
    <div th:replace="~{fragment/navbar :: custom-header}"></div>

    <div class="page-content">

        <a th:href="@{/}" class="btn-voltar">
            <i class="ti ti-arrow-left"></i> Voltar
        </a>

        <h2 class="page-title">Meus Serviços</h2>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <div th:if="${#lists.isEmpty(projetos)}" class="text-center empty-state" style="margin-top: 3rem;">
            <i class="ti ti-mood-empty" style="font-size: 40px;"></i>
            <p style="margin-top: 8px;">Você ainda não criou nenhum serviço.</p>
        </div>

        <div th:each="p : ${projetos}" class="projeto-card" th:onclick="|toggleDetalhes('detalhes-' + ${p.id})|">
            <p class="projeto-titulo" th:text="${p.titulo}">Título</p>
            <span class="projeto-status"
                  th:text="${p.status}"
                  th:classappend="${#strings.equalsIgnoreCase(p.status, 'ABERTO')} ? 'status-aberto' :
                      (${#strings.equalsIgnoreCase(p.status, 'EM_ANDAMENTO')} ? 'status-em_andamento' :
                      (${#strings.equalsIgnoreCase(p.status, 'CONCLUIDO')} ? 'status-concluido' : 'status-cancelado'))">
                ABERTO
            </span>
            <p class="projeto-servicos">
                <span th:each="s : ${p.servicos}" th:text="${s}">Serviço</span>
            </p>

            <div class="projeto-detalhes" th:id="|detalhes-${p.id}|">
                <p class="detalhe-row"><strong>Cidade:</strong> <span th:text="${p.cidade}">—</span></p>
                <p class="detalhe-row"><strong>Descrição:</strong> <span th:text="${p.descricao}">—</span></p>
                <p class="detalhe-row">
                    <strong>Orçamento:</strong>
                    <span th:if="${p.orcamento == 0}">A ser definido pelo profissional</span>
                    <span th:unless="${p.orcamento == 0}">R$ <span th:text="${p.orcamento}">—</span></span>
                </p>
                <p class="detalhe-row"><strong>Cidade:</strong> <span th:text="${p.cidade}">—</span></p>
                <p class="detalhe-row">
                    <strong>Dias de trabalho:</strong>
                    <span th:each="dia, iter : ${p.diasTrabalho}">
                        <span th:text="${dia}"></span><span th:if="${!iter.last}">, </span>
                    </span>
                </p>

                <div class="d-flex gap-2 mt-2">

    <a th:href="@{/projetoporId/{id}(id=${p.id})}"
       class="btn btn-sm btn-outline-dark"
       style="font-size: 12px; border-radius: 6px;"
       onclick="event.stopPropagation()">
        Ver informações
    </a>

    <form th:if="${p.status == 'ABERTO'}"
          th:action="@{/propostas/{id}(id=${p.id})}"
          method="get"
          onclick="event.stopPropagation()">

        <button type="submit"
                class="btn btn-sm btn-outline-dark"
                style="font-size: 12px; border-radius: 6px;">
            Ver propostas recebidas
        </button>

    </form>

</div>
            </div>
        </div>

    </div>

    <script>
        function toggleDetalhes(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('aberto');
        }
    </script>
</body>
</html>
