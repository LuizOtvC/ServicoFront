<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Criar Serviço</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>

    <style>

        body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.container{
    width:100%;
    max-width:1000px;
    margin:50px auto 40px;
    padding:0 30px;
}

.header{
    margin-bottom:35px;
}

.cabecalho h2{
    color:white;
    font-size:38px;
    font-weight:700;
    margin-bottom:8px;
}

.cabecalho p{
    color:#cbd5e1;
    font-size:16px;
}

.form-section{
    margin-bottom:35px;
}

.section-title{
    font-size:13px;
    font-weight:700;
    color:#bfdbfe;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:18px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,0.25);
}

.info-label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:white;
    margin-bottom:8px;
}

.form-control,
.form-select{
    border-radius:10px;
    min-height:45px;
    background:white;
    border:none;
}

.form-control:focus,
.form-select:focus{
    border-color:#1a1a2e;
    box-shadow:0 0 0 .2rem rgba(26,26,46,.15);
}

textarea.form-control{
    min-height:120px;
}

.botoes{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:40px;
}

.btn-principal{
    background:white;
    color:#0d1b3e;
    border:none;
    border-radius:10px;
    padding:12px 30px;
    font-weight:600;
}

.btn-principal:hover{
    background:#dbeafe;
    color:#0d1b3e;
}

.btn-secundario{
    border:1px solid rgba(255,255,255,.5);
    color:white;
    border-radius:10px;
    padding:12px 30px;
    text-decoration:none;
}

.btn-secundario:hover{
    background:#1a1a2e;
    color:white;
}

    </style>
<div th:replace="~{fragment/Background :: background-css}"></div>
</head>

<body class="background-padrao">
    <div th:replace="~{fragment/navbar :: custom-header}"></div>
    
    
<div class="container">
<div class="pagina">

    <div class="cabecalho">
        <h2>Criar Serviço</h2>
        <p>Preencha as informações do projeto que deseja publicar.</p>
    </div>

    <div class="conteudo">

        <div th:if="${errorMessage}"
             class="alert alert-danger"
             role="alert">

            <span th:text="${errorMessage}"></span>

        </div>

        <form action="/projeto/criar"
              method="post"
              th:object="${projeto}">

            <div class="bloco">

                <label class="info-label">
                    <i class="ti ti-clipboard-text"></i>
                    Título
                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{titulo}"
                        placeholder="Ex: Reforma elétrica residencial">

            </div>

            <div class="bloco">

                <label class="info-label">
                    <i class="ti ti-file-description"></i>
                    Descrição
                </label>

                <textarea
                        class="form-control"
                        th:field="*{descricao}"
                        placeholder="Descreva tudo o que precisa ser feito..."></textarea>

            </div>

                            <div class="bloco">

                <label class="info-label">
                    <i class="ti ti-cash"></i>
                    Orçamento (R$)
                </label>

                <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        th:field="*{orcamento}"
                        placeholder="Ex: 1500.00">

                <div class="form-check">

                    <input
                            class="form-check-input"
                            type="checkbox"
                            id="semOrcamento">

                    <label class="form-check-label" for="semOrcamento" style="color:#dbeafe;">
                        O orçamento será definido pelo profissional.
                    </label>

                </div>

            </div>


            <div class="bloco">

                <label class="info-label">
                    <i class="ti ti-calendar-week"></i>
                    Dias de trabalho
                </label>

                <select
                        th:field="*{diasTrabalho}"
                        class="form-select"
                        multiple
                        size="7">

                    <option value="SEGUNDA">SEGUNDA</option>
                    <option value="TERCA">TERÇA</option>
                    <option value="QUARTA">QUARTA</option>
                    <option value="QUINTA">QUINTA</option>
                    <option value="SEXTA">SEXTA</option>
                    <option value="SABADO">SÁBADO</option>
                    <option value="DOMINGO">DOMINGO</option>

                </select>

                <small style="color:#dbeafe;">
                    Segure Ctrl (ou Cmd no Mac) para selecionar mais de um dia.
                </small>

            </div>


            <div class="bloco">

                <label class="info-label">
                    <i class="ti ti-tool"></i>
                    Serviços necessários
                </label>

                <select
                        name="servicosId"
                        class="form-select"
                        multiple
                        size="7">

                    <option
                            th:each="s : ${servicos}"
                            th:value="${s.id}"
                            th:text="${s.nome}">
                    </option>

                </select>

                <small style="color:#dbeafe;">
                    Segure Ctrl (ou Cmd no Mac) para selecionar mais de um serviço.
                </small>

            </div>


            <button
                    type="submit"
                    class="btn-principal">

                <i class="ti ti-check"></i>
                Criar Serviço

            </button>

        

        <a
                th:href="@{/}"
                class="btn-secundario">

            <i class="ti ti-arrow-left"></i>
            Cancelar

        </a>
</form>
    </div>

</div>

   <script>
document.getElementById("semOrcamento").addEventListener("change", function () {

    const campo = document.querySelector("[name='orcamento']");

    if (this.checked) {
        campo.value = 0;
        campo.readOnly = true;
        campo.style.background = "#f4f6f9";
    } else {
        campo.value = "";
        campo.readOnly = false;
        campo.style.background = "white";
    }

});
</script>
</div>
</body>
</html>
