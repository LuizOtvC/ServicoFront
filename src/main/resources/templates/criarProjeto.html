<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Criar Serviço</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>

    <style>

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .page-content {
            width: 100%;
            max-width: 720px;
            margin: 50px auto 60px;
            padding: 0 24px;
        }

        .form-shell {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 2.5rem clamp(1.5rem, 5vw, 3rem) 2.75rem;
            box-shadow: 0 20px 60px rgba(3, 8, 20, 0.3);
        }

        .cabecalho {
            margin-bottom: 30px;
        }

        .cabecalho h2 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .cabecalho p {
            color: #cbd5e1;
            font-size: 15px;
            margin: 0;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section:last-of-type {
            margin-bottom: 0;
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 12px;
            font-weight: 700;
            color: #bfdbfe;
            text-transform: uppercase;
            letter-spacing: .5px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.16);
        }

        .bloco {
            margin-bottom: 1.5rem;
        }

        .bloco:last-child {
            margin-bottom: 0;
        }

        .info-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .info-label i {
            color: #9ec5ff;
            font-size: 15px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            min-height: 45px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #1a1a2e;
            transition: background .2s, border-color .2s, box-shadow .2s;
        }

        .form-control::placeholder { color: #94a3b8; }

        .form-control:focus,
        .form-select:focus {
            background: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 0 .2rem rgba(96, 165, 250, .25);
        }

        textarea.form-control {
            min-height: 120px;
        }

        .form-check-input {
            accent-color: #0d1b3e;
        }

        .grid-dois {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1.75rem;
        }

        .grid-dois .bloco {
            margin-bottom: 0;
        }

        .dica-campo {
            display: block;
            color: #9fb3d1;
            font-size: 12px;
            margin-top: 6px;
        }

        .botoes {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 40px;
        }

        .btn-principal {
            background: white;
            color: #0d1b3e;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: background .2s;
        }

        .btn-principal:hover {
            background: #dbeafe;
            color: #0d1b3e;
        }

        .btn-secundario {
            border: 1px solid rgba(255,255,255,.5);
            color: white;
            border-radius: 10px;
            padding: 12px 30px;
            text-decoration: none;
            transition: background .2s, border-color .2s;
        }

        .btn-secundario:hover {
            background: #fff;
                color: #1a1a2e;

        }

        @media (max-width: 640px) {
            .grid-dois {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .form-shell {
                border-radius: 16px;
            }
            .botoes {
                flex-direction: column-reverse;
            }
            .botoes .btn-principal,
            .botoes .btn-secundario {
                width: 100%;
                text-align: center;
            }
        }

    </style>
<div th:replace="~{fragment/Background :: background-css}"></div>
</head>

<body class="background-padrao">
    <div th:replace="~{fragment/navbar :: custom-header}"></div>

<div class="page-content">
<div class="form-shell">

    <div class="cabecalho">
        <h2>Criar Serviço</h2>
        <p>Preencha as informações do projeto que deseja publicar.</p>
    </div>

    <div class="conteudo">

        <div th:if="${errorMessage}"
             class="alert alert-danger"
             role="alert">

            <span th:text="${errorMessage}"></span>

        </div>

        <form action="/projeto/criar"
              method="post"
              th:object="${projeto}">

            <div class="form-section">
                <h3 class="section-title">Sobre o projeto</h3>

                <div class="bloco">

                    <label class="info-label">
                        <i class="ti ti-clipboard-text"></i>
                        Título
                    </label>

                    <input
                            type="text"
                            class="form-control"
                            th:field="*{titulo}"
                            placeholder="Ex: Reforma elétrica residencial">

                </div>

                <div class="bloco">

                    <label class="info-label">
                        <i class="ti ti-file-description"></i>
                        Descrição
                    </label>

                    <textarea
                            class="form-control"
                            th:field="*{descricao}"
                            placeholder="Descreva tudo o que precisa ser feito..."></textarea>

                </div>

                <div class="bloco">

                    <label class="info-label">
                        <i class="ti ti-cash"></i>
                        Orçamento (R$)
                    </label>

                    <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            th:field="*{orcamento}"
                            placeholder="Ex: 1500.00">

                    <div class="form-check mt-2">

                        <input
                                class="form-check-input"
                                type="checkbox"
                                id="semOrcamento">

                        <label class="form-check-label" for="semOrcamento" style="color:#dbeafe;">
                            O orçamento será definido pelo profissional.
                        </label>

                    </div>

                </div>
            </div>

            <div class="form-section">
                <h3 class="section-title">Disponibilidade e serviços</h3>

                <div class="grid-dois">

                    <div class="bloco">

                        <label class="info-label">
                            <i class="ti ti-calendar-week"></i>
                            Dias de trabalho
                        </label>

                        <select
                                th:field="*{diasTrabalho}"
                                class="form-select"
                                multiple
                                size="7">

                            <option value="SEGUNDA">SEGUNDA</option>
                            <option value="TERCA">TERÇA</option>
                            <option value="QUARTA">QUARTA</option>
                            <option value="QUINTA">QUINTA</option>
                            <option value="SEXTA">SEXTA</option>
                            <option value="SABADO">SÁBADO</option>
                            <option value="DOMINGO">DOMINGO</option>

                        </select>

                        <small class="dica-campo">
                            Segure Ctrl (ou Cmd no Mac) para selecionar mais de um dia.
                        </small>

                    </div>

                    <div class="bloco">

                        <label class="info-label">
                            <i class="ti ti-tool"></i>
                            Serviços necessários
                        </label>

                        <select
                                name="servicosId"
                                class="form-select"
                                multiple
                                size="7">

                            <option
                                    th:each="s : ${servicos}"
                                    th:value="${s.id}"
                                    th:text="${s.nome}">
                            </option>

                        </select>

                        <small class="dica-campo">
                            Segure Ctrl (ou Cmd no Mac) para selecionar mais de um serviço.
                        </small>

                    </div>

                </div>
            </div>

            <div class="botoes">
    <a th:href="@{/}" class="btn-secundario"><i class="ti ti-arrow-left"></i> Cancelar</a>
    <button type="submit" class="btn-principal"><i class="ti ti-check"></i> Criar Serviço</button>
</div>

        </form>
    </div>

</div>
</div>

   <script>
document.getElementById("semOrcamento").addEventListener("change", function () {

    const campo = document.querySelector("[name='orcamento']");

    if (this.checked) {
        campo.value = 0;
        campo.readOnly = true;
        campo.style.background = "rgba(255,255,255,0.5)";
    } else {
        campo.value = "";
        campo.readOnly = false;
        campo.style.background = "";
    }

});
</script>
</body>
</html>
